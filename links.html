<style>
/* self-contained link page (the target of the QR code on the business card): ribbon hero + white panel, like the site footer */
:root{--ink:#04122e;--royal:#1657d6;--sky:#7db4ff;--ice:#dbe9ff;--muted:#56678a;--line:rgba(4,18,46,.12);
  --font:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;--gutter:clamp(16px,2.2vw,28px)}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;font-family:var(--font);font-size:16px;line-height:1.55;color:#fff;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,rgba(4,18,46,.55),rgba(4,18,46,.1) 30%,rgba(4,18,46,.2) 60%,rgba(4,18,46,.8)),var(--ink) url("assets/hero.webp") center/cover no-repeat fixed}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
header{display:flex;justify-content:center;padding:26px var(--gutter) 10px}
header img{height:38px;width:auto}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px var(--gutter) 40px}
.panel{width:min(100%,460px);background:#fff;color:var(--ink);padding:clamp(22px,5vw,34px)}
.label{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--royal)}
.label::before{content:"";width:6px;height:6px;background:var(--royal)}
h1{font-weight:400;font-size:clamp(32px,8vw,42px);line-height:1.04;letter-spacing:-.04em;margin:16px 0 8px}
h1 span{color:var(--royal)}
.panel > p{color:var(--muted);font-size:15px}
ul{list-style:none;margin-top:24px;border-top:1px solid var(--line)}
li a{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);transition:padding .35s cubic-bezier(.16,1,.3,1),color .3s}
li a:hover{padding-left:8px;color:var(--royal)}
.ico{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:2px;color:var(--royal)}
.ico svg{width:19px;height:19px;fill:currentColor}
li b{display:block;font-weight:500;font-size:16.5px;letter-spacing:-.01em}
li small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted)}
.go{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);transition:transform .45s cubic-bezier(.16,1,.3,1)}
.go svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
li a:hover .go{transform:rotate(45deg)}
.site{display:flex;justify-content:space-between;align-items:center;margin-top:22px;height:46px;padding:0 7px 0 20px;background:var(--royal);color:#fff;border-radius:2px;font-size:14px;font-weight:500;transition:background .35s}
.site:hover{background:#0a2a6b}
.site .go{border-color:rgba(255,255,255,.55)}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;padding:14px var(--gutter);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.78)}
</style>
</head>
