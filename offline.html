a{color:inherit;text-decoration:none}
header{display:flex;justify-content:center;padding:22px var(--gutter)}
header img{height:36px;width:auto}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center;padding:40px var(--gutter) 56px}
.label{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);margin-bottom:22px}
.label::before{content:"";width:6px;height:6px;background:var(--sky)}
h1{font-weight:400;font-size:clamp(38px,5.4vw,76px);line-height:1.02;letter-spacing:-.045em;margin-bottom:18px}
h1 i{font-family:var(--serif);font-weight:400;letter-spacing:-.02em}
main p{max-width:500px;margin:0 auto;color:rgba(255,255,255,.82)}
.note a{border-bottom:1px solid rgba(255,255,255,.45);transition:border-color .3s}
.note a:hover{border-color:#fff}
.btn{display:inline-flex;align-items:center;height:46px;padding:0 22px;border-radius:2px;background:#fff;color:var(--ink);border:1px solid #fff;font:500 14px var(--font);cursor:pointer;transition:background .3s}
.btn:hover{background:#dbe9ff}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px 24px;padding:14px var(--gutter);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.78)}
footer nav{display:flex;gap:16px;flex-wrap:wrap}
footer a{transition:color .3s}
footer a:hover{color:#fff}
/* ---------- Reel: the bouncing-ball film strip on the 404, offline and maintenance pages ---------- */
.reel-wrap{width:min(100%,720px)}
.reel{--g:8px;--p:16px;position:relative;padding:24px var(--p);background:rgba(2,10,28,.55);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.reel::before,.reel::after{content:"";position:absolute;left:var(--p);right:var(--p);height:7px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 9px,transparent 9px 20px)}
.reel::before{top:8px}
.reel::after{bottom:8px}
.reel-frames{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--g)}
.reel-frame{position:relative;aspect-ratio:1;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04)}
.reel-frame svg{position:absolute;inset:0;width:100%;height:100%}
.reel-frame line{stroke:rgba(255,255,255,.35);stroke-width:1.5}
.reel-frame ellipse{fill:#fff}
.reel-frame span{position:absolute;left:6px;top:5px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:rgba(255,255,255,.6)}
.reel-frame.is-missing{border:1px dashed var(--sky);background:rgba(125,180,255,.08)}
.reel-frame.is-missing span{color:var(--sky)}
.reel-frame.is-missing b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--sky);animation:reelBlink 1.4s steps(2) infinite}
/* the playhead steps across the 7 frames: its own width plus one gap per step */
.reel-head{position:absolute;top:24px;left:var(--p);width:calc((100% - 2 * var(--p) - 6 * var(--g)) / 7);aspect-ratio:1;border:2px solid var(--sky);pointer-events:none;animation:reelHead 2.8s steps(7) infinite}
.reel.paused .reel-head{animation:none}
.reel-cap{margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7)}
@keyframes reelHead{to{transform:translateX(calc(7 * (100% + var(--g))))}}
@keyframes reelBlink{50%{opacity:.25}}
@media (max-width:600px){
  .reel{--g:5px;--p:10px;padding:20px var(--p)}
  .reel-head{top:20px}
  .reel-frame span{font-size:8px;left:4px;top:3px}
  .reel-frame:not(.is-missing) span{display:none}   /* a 40px frame is too small for both the number and the ball */
  .reel-frame.is-missing b{font-size:7px;letter-spacing:.04em}
}
@media (prefers-reduced-motion: reduce){.reel-head,.reel-frame.is-missing b{animation:none}}
</style>
</head>
